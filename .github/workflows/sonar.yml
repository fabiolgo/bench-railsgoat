# SonarQube Cloud CI analysis (sq-vs-aikido benchmark). Source-only languages, no build needed.
# Runs on main only; not on pull requests.
name: SonarQube Cloud analysis
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=fabiolgo
            -Dsonar.projectKey=fabiolgo_bench-railsgoat
